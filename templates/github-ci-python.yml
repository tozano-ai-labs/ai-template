# Modèle de pipeline d'intégration continue pour un projet Python.
#
# À copier vers .github/workflows/ci.yml dans le projet consommateur, puis adapter :
#   - la version de Python ;
#   - l'outil d'installation (uv, pip, poetry) ;
#   - les commandes de lint et de format selon l'outillage réel.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Linter
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests et couverture
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Recherche de secrets commités par erreur
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::un fichier .env est versionné"
            exit 1
          fi
        shell: bash

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: coverage.xml
          retention-days: 7
          if-no-files-found: ignore